name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        working-directory: services/api
        run: pip install -r requirements.txt
      - name: Pytest
        working-directory: services/api
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t tessa-api:ci --target prod services/api
          docker build -t tessa-worker:ci --target prod services/worker
          docker build -t tessa-web:ci --target prod services/web
